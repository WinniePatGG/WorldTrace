# Gradle
# Loom 1.19.x requires a Java 25+ JVM to run Gradle itself, while the mod is compiled
# for Java 21 (the runtime bundled with Minecraft 1.21.1). See `java.toolchain` in build.gradle.kts.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.installations.paths=C\:\\Program Files\\Java\\jdk-21.0.11

# Fabric / Minecraft toolchain
# Compatibility matrix verified against https://fabricmc.net/develop
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.14
fabric_version=0.116.17+1.21.1
loom_version=1.19.1

# Mod metadata
mod_version=1.0.0
mod_id=worldtrace
mod_name=WorldTrace
maven_group=dev.worldtrace
archives_base_name=WorldTrace

# Dependency versions for build tooling
junit_version=5.11.4